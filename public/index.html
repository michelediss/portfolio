    <style>
        body {
            transition: background-color 0.4s ease-in-out; 
            animation: fadeIn 1.5s ease-in-out forwards; 
            opacity: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

<body class="opacity">

        <!-- Your Vue app will mount here -->
    </div>
</body>
<script>
    // Genera dinamicamente una classe `style-n` e aggiungila al body
    function assignRandomStyle() {
      const randomNum = Math.floor(Math.random() * 12) + 1;
      document.body.classList.add(`style-${randomNum}`);
    }
    
    // Assegna la classe subito prima che la pagina venga renderizzata
    assignRandomStyle();
  </script>
